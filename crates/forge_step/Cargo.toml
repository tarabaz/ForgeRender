[package]
name = "forge_step"
description = "Convertitore STEP → mesh per ForgeRender, basato su Open CASCADE Technology (processo separato)."
version.workspace = true
edition.workspace = true
publish.workspace = true
# Open CASCADE è LGPL-2.1 con eccezione: resta confinato in questo eseguibile separato.
license = "LGPL-2.1-only"

[[bin]]
name = "forgerender-step"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
forge_import.workspace = true

[dev-dependencies]
forge_scene.workspace = true

[build-dependencies]
occt-sys = "=7.8.1"
cc = "1"
