[package]
name = "forge_app"
description = "ForgeRender: applicazione desktop (egui/eframe + viewport wgpu)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "forgerender"
path = "src/main.rs"

[dependencies]
forge_manual = { path = "../forge_manual" }
forge_math.workspace = true
forge_scene.workspace = true
forge_import.workspace = true
forge_project.workspace = true
forge_render_core.workspace = true
forge_accel.workspace = true
rayon.workspace = true
forge_render_cpu.workspace = true
forge_render_gpu.workspace = true
forge_denoise.workspace = true
forge_library.workspace = true
image.workspace = true
forge_image_io.workspace = true
forge_telemetry.workspace = true
forge_mcp.workspace = true
eframe.workspace = true
rfd.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

# Video MP4 (H.264) con Media Foundation, incluso in Windows: niente da installare.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
