[package]
name = "forge_render_core"
description = "Interfacce comuni dei backend: impostazioni, scena compilata, accumulo progressivo, sessione di rendering."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
forge_math.workspace = true
forge_scene.workspace = true
forge_accel.workspace = true
forge_volume.workspace = true
serde.workspace = true
tracing.workspace = true
rayon.workspace = true
anyhow.workspace = true
image.workspace = true
# EXR con canali che `image` non legge (luminanza "Y", es. AO e rugosità di Poly Haven).
# Stessa versione già usata da `image`, senza rayon.
exr = { version = "1.74", default-features = false }
