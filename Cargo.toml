[workspace]
resolver = "2"
members = ["crates/forge_*"]
# Il convertitore STEP compila Open CASCADE (lento): si costruisce solo se richiesto esplicitamente.
default-members = [
    "crates/forge_math",
    "crates/forge_scene",
    "crates/forge_accel",
    "crates/forge_volume",
    "crates/forge_render_core",
    "crates/forge_render_cpu",
    "crates/forge_render_gpu",
    "crates/forge_denoise",
    "crates/forge_library",
    "crates/forge_import",
    "crates/forge_project",
    "crates/forge_image_io",
    "crates/forge_telemetry",
    "crates/forge_cli",
    "crates/forge_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
authors = ["FrancyStore3D"]
rust-version = "1.85"

[workspace.dependencies]
forge_math = { path = "crates/forge_math" }
forge_scene = { path = "crates/forge_scene" }
forge_accel = { path = "crates/forge_accel" }
forge_render_core = { path = "crates/forge_render_core" }
forge_render_cpu = { path = "crates/forge_render_cpu" }
forge_render_gpu = { path = "crates/forge_render_gpu" }
forge_denoise = { path = "crates/forge_denoise" }
forge_library = { path = "crates/forge_library" }
forge_import = { path = "crates/forge_import" }
forge_project = { path = "crates/forge_project" }
forge_image_io = { path = "crates/forge_image_io" }
forge_volume = { path = "crates/forge_volume" }
forge_telemetry = { path = "crates/forge_telemetry" }

glam = { version = "0.30", features = ["serde", "bytemuck"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr", "tiff", "tga", "bmp"] }
tobj = "4.0"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "KHR_lights_punctual", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_emissive_strength"] }
stl_io = "0.11"
sysinfo = "0.39"
rfd = "0.17"
# static-dxc: compilatore di shader DXC incluso nell'eseguibile (solo Windows MSVC): il vecchio
# FXC non riesce a compilare il path tracer GPU per DirectX 12.
wgpu = { version = "30", features = ["static-dxc"] }
pollster = "1"
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "default_fonts", "x11", "wayland", "persistence"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# Le dipendenze vengono ottimizzate anche in debug: il path tracer in debug puro sarebbe inutilizzabile.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
