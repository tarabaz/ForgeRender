[workspace]
resolver = "2"
members = ["crates/forge_*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
authors = ["FrancyStore3D"]
rust-version = "1.85"

[workspace.dependencies]
forge_math = { path = "crates/forge_math" }
forge_scene = { path = "crates/forge_scene" }
forge_accel = { path = "crates/forge_accel" }
forge_render_core = { path = "crates/forge_render_core" }
forge_render_cpu = { path = "crates/forge_render_cpu" }
forge_import = { path = "crates/forge_import" }
forge_project = { path = "crates/forge_project" }
forge_image_io = { path = "crates/forge_image_io" }
forge_telemetry = { path = "crates/forge_telemetry" }

glam = { version = "0.30", features = ["serde", "bytemuck"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
image = { version = "0.25", default-features = false, features = ["png", "hdr", "exr"] }
tobj = "4.0"
stl_io = "0.11"
sysinfo = "0.39"
rfd = "0.17"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "default_fonts", "x11", "wayland", "persistence"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# Le dipendenze vengono ottimizzate anche in debug: il path tracer in debug puro sarebbe inutilizzabile.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
