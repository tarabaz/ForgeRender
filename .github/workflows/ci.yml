name: CI

# Si compila solo quando cambia il codice: i commit che toccano soltanto documenti,
# report e note tra agenti (reports/, docs/, file .md) non avviano la build.
# La build si può sempre lanciare a mano da Actions → CI → Run workflow.
on:
  push:
    paths-ignore:
      - 'reports/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'reports/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Un nuovo push sullo stesso branch annulla i run precedenti ancora in corso:
# conta solo l'ultima versione del codice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Rileva modifiche al codice
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!reports/**'
              - '!docs/**'
              - '!**/*.md'

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Vulkan software (lavapipe) per i test del backend GPU
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Open Image Denoise (per i test del denoiser)
        run: |
          curl -sSL https://github.com/RenderKit/oidn/releases/download/v2.3.3/oidn-2.3.3.x86_64.linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "FORGE_OIDN_DIR=$RUNNER_TEMP/oidn-2.3.3.x86_64.linux" >> "$GITHUB_ENV"
          echo "FORGE_REQUIRE_OIDN=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude forge_step --all-targets --release -- -D warnings
      - run: cargo test --workspace --exclude forge_step --release

  # Il convertitore STEP (Open CASCADE, ~1 ora di compilazione) è momentaneamente escluso
  # dalla CI: i modelli SolidWorks si importano in GLB. Per riattivarlo: job con
  # `cargo test -p forge_step --release` e `cargo build --release -p forge_step` su Windows.

  windows:
    name: Build e pacchetti (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Conserva la compilazione di Open CASCADE (~1 ora) anche se un passo fallisce.
          cache-on-failure: true
      - name: Open Image Denoise (test e pacchetti)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "oidn.zip"
          Invoke-WebRequest -Uri "https://github.com/RenderKit/oidn/releases/download/v2.3.3/oidn-2.3.3.x64.windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          "FORGE_OIDN_DIR=$env:RUNNER_TEMP\oidn-2.3.3.x64.windows\bin" >> $env:GITHUB_ENV
          "OIDN_ROOT=$env:RUNNER_TEMP\oidn-2.3.3.x64.windows" >> $env:GITHUB_ENV
          "FORGE_REQUIRE_OIDN=1" >> $env:GITHUB_ENV
      - name: Test
        run: cargo test --workspace --exclude forge_step --release
      - name: Compilazione
        run: cargo build --release -p forge_app -p forge_cli
      - name: Benchmark (runner GitHub, solo indicativo)
        run: target\release\forgerender-cli.exe bench --spp 8 --json bench-windows-runner.json
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Pacchetti portable e installer
        shell: pwsh
        run: packaging\windows\package.ps1 -SkipBuild -OidnDir $env:OIDN_ROOT
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeRender-portable-x64
          path: dist/*-portable-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeRender-setup-x64
          path: dist/*-setup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-runner
          path: bench-windows-runner.json
